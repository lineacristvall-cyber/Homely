<text x="78.0" y="63.0" text-anchor="start" font-family="Arial, sans-serif" font-size="30.0" fill="#1F2925">03 · Evidence, actual-product room view and comparison</text>
<text x="78.0" y="133.45" text-anchor="start" font-family="Arial, sans-serif" font-size="17.0" fill="#1F2925">Screens S10–S14. Ready stock requires the exact variant, required count and fresh evidence. A room composite is illustrative; measured physical fit is assessed independently.</text>
