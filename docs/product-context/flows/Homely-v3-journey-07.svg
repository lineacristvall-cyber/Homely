<text x="78.0" y="133.45" text-anchor="start" font-family="Arial, sans-serif" font-size="17.0" fill="#1F2925">Screens S22–S23. Cache is visibly stale; no offline stock claim or seller handoff. Return destinations depend on the stored caller. Permanent purge requires a separate explicit confirmation.</text>
